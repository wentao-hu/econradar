<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#eef1f6" />
  <meta name="description" content="EconRadar 经济雷达：国内外主要指数、行业指数、美国宏观指标与板块资金流向。" />
  <title>EconRadar · 经济雷达</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EconRadar" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="icons/icon-192.png" alt="" width="36" height="36" />
        </span>
        <span class="brand-text">
          <strong>EconRadar</strong>
          <small>经济雷达</small>
        </span>
      </div>

      <nav class="tabs" role="tablist" aria-label="页面切换">
        <button class="tab active" data-page="market" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 17 9 11 13 15 21 7" />
            <polyline points="15 7 21 7 21 13" />
          </svg>
          <span>市场</span>
        </button>
        <button class="tab" data-page="industry" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span>行业</span>
        </button>
        <button class="tab" data-page="fundflow" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8h13" />
            <polyline points="13 4 17 8 13 12" />
            <path d="M20 16H7" />
            <polyline points="11 12 7 16 11 20" />
          </svg>
          <span>资金</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <span class="data-status" id="data-status" title="数据由 GitHub Actions 定时抓取">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="update-time">加载中…</span>
          <span class="status-hint" id="status-hint">每 15 分钟自动更新</span>
        </span>
        <button class="refresh-btn" id="refresh-btn" title="重新加载最新数据" aria-label="刷新数据">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 6.3" />
            <polyline points="20 4 20 11 13 11" />
          </svg>
          <span class="refresh-label">刷新</span>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="page active" id="page-market" role="tabpanel" aria-label="市场概览">
        <div class="page-head">
          <div>
            <h1>市场概览</h1>
            <p>国内指数、全球市场、大宗商品与美国宏观</p>
          </div>
          <span class="page-badge" id="market-count"></span>
        </div>

        <section class="group pinned-group" id="pinned-market" hidden>
          <h2 class="section-title">置顶<span class="pinned-count" id="pinned-count-market"></span></h2>
          <div id="grid-pinned-market" class="grid"></div>
        </section>

        <section class="group">
          <h2 class="section-title">国内指数</h2>
          <div id="grid-cn" class="grid"></div>
        </section>
        <section class="group">
          <h2 class="section-title">全球指数</h2>
          <div id="grid-global" class="grid"></div>
        </section>
        <section class="group">
          <h2 class="section-title">大宗商品</h2>
          <div id="grid-commodity" class="grid"></div>
        </section>
        <section class="group">
          <h2 class="section-title">美国宏观经济</h2>
          <div id="grid-usmacro" class="grid"></div>
        </section>
      </section>

      <section class="page" id="page-industry" role="tabpanel" aria-label="行业概览" hidden>
        <div class="page-head">
          <div>
            <h1>行业概览</h1>
            <p>中证、国证与美国行业指数</p>
          </div>
          <span class="page-badge" id="industry-count"></span>
        </div>

        <section class="group pinned-group" id="pinned-industry" hidden>
          <h2 class="section-title">置顶<span class="pinned-count" id="pinned-count-industry"></span></h2>
          <div id="grid-pinned-industry" class="grid"></div>
        </section>

        <section class="group">
          <h2 class="section-title">中证行业</h2>
          <div id="grid-cn-index" class="grid"></div>
        </section>
        <section class="group">
          <h2 class="section-title">国证行业</h2>
          <div id="grid-cn-cni" class="grid"></div>
        </section>
        <section class="group">
          <h2 class="section-title">美国行业</h2>
          <div id="grid-us-industry" class="grid"></div>
        </section>
      </section>

      <section class="page" id="page-fundflow" role="tabpanel" aria-label="资金流向" hidden>
        <div class="page-head">
          <div>
            <h1>资金流向</h1>
            <p>行业板块主力净流入 / 净流出 TOP10</p>
          </div>
          <a class="text-link" id="fundflow-title" href="https://data.eastmoney.com/bkzj/hy.html" target="_blank" rel="noopener noreferrer" title="在东方财富打开板块资金流向页核对数据">
            核对数据
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7" />
              <polyline points="9 7 17 7 17 15" />
            </svg>
          </a>
        </div>

        <div class="ff-toolbar">
          <div class="ff-range" role="radiogroup" aria-label="排行周期">
            <label class="ff-range-item"><input type="radio" name="ff-range" value="today" checked /><span>今日排行</span></label>
            <label class="ff-range-item"><input type="radio" name="ff-range" value="5d" /><span>5日排行</span></label>
            <label class="ff-range-item"><input type="radio" name="ff-range" value="10d" /><span>10日排行</span></label>
          </div>
          <span class="ff-stamp" id="ff-stamp"></span>
        </div>

        <div class="ff-grid">
          <section class="ff-card">
            <div class="ff-section-head">
              <h2>主力净流入 TOP10</h2>
              <span class="ff-total up" id="ff-inflow-total">--</span>
            </div>
            <div id="ff-inflow" class="ff-chart"><div class="ff-empty">加载中…</div></div>
          </section>
          <section class="ff-card">
            <div class="ff-section-head">
              <h2>主力净流出 TOP10</h2>
              <span class="ff-total down" id="ff-outflow-total">--</span>
            </div>
            <div id="ff-outflow" class="ff-chart"><div class="ff-empty">加载中…</div></div>
          </section>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" role="tablist" aria-label="页面切换">
      <button class="bottom-tab active" data-page="market" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 17 9 11 13 15 21 7" />
          <polyline points="15 7 21 7 21 13" />
        </svg>
        <span>市场</span>
      </button>
      <button class="bottom-tab" data-page="industry" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        <span>行业</span>
      </button>
      <button class="bottom-tab" data-page="fundflow" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8h13" />
          <polyline points="13 4 17 8 13 12" />
          <path d="M20 16H7" />
          <polyline points="11 12 7 16 11 20" />
        </svg>
        <span>资金</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
