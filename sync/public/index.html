<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EconRadar Sync API</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; background: #eef1f6; color: #0f172a; padding: 48px 24px; }
    main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 12px 30px -20px rgba(15,23,42,.35); }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { font-size: 14px; line-height: 1.7; color: #475569; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>EconRadar Sync API</h1>
    <p>用于 EconRadar 网页版跨设备同步卡片排序。</p>
    <p><code>GET /api/order</code> 读取排序快照，<code>PUT /api/order</code> 保存排序快照。</p>
  </main>
</body>
</html>
