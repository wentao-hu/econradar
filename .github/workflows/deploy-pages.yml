name: Update data & deploy Pages

on:
  schedule:
    # 每 15 分钟抓取一次；数据源都是公开行情/宏观接口
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'lib/**'
      - 'scripts/collect.js'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous snapshot for fallback
        run: |
          if git fetch origin gh-pages --depth=1 2>/dev/null &&
             git show origin/gh-pages:data/latest.json > /tmp/previous.json 2>/dev/null; then
            echo "PREVIOUS_DATA=/tmp/previous.json" >> "$GITHUB_ENV"
            echo "已恢复上次数据快照作为失败回退"
          else
            echo "没有可用的历史快照，本次全量抓取"
          fi

      - name: Collect data
        run: node scripts/collect.js

      - name: Verify snapshot
        run: |
          node -e "
            const d = require('./web/data/latest.json');
            const count = (d.indices || []).length + (d.industries || []).length;
            if (!d.generatedAt || count === 0) {
              console.error('数据快照无效');
              process.exit(1);
            }
            console.log('快照时间', d.generatedAtBeijing, '共', count, '条行情/行业数据');
          "

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/deploy
          cp -R web /tmp/deploy
          cd /tmp/deploy
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
